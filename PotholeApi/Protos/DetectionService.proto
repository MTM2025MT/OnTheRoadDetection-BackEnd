syntax = "proto3";
option csharp_namespace = "PotholeApi.Protos";
import "google/protobuf/timestamp.proto";

service DetectionService {
  rpc AddData (stream PotholeRequest) returns (StreamSummary);
}

message PotholeRequest {
  Location location = 1;
  int32 level_of_severity = 2;
  string description = 3;
  google.protobuf.Timestamp timestamp = 4;
  bytes image = 5;                // binary image data (jpeg/png)
  repeated DoubleArray bounding_boxes_arrays = 6;
  double confidence = 7;
}


message StreamSummary {
  int32 total_potholes_received = 1;
  bool success = 2;
}

message DoubleArray { repeated double values = 1; }

message Location { double latitude = 1; double longitude = 2; }